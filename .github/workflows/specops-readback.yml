name: SpecOps — read-only real artifact verification
on:
  pull_request:
    branches: [review/specops-issue-40]
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: sudo apt-get update -qq && sudo apt-get install -y python3-yaml skopeo
      - name: Read actual CI metadata and checksum, then execute OCI with no write token
        env: {GH_TOKEN: '${{ github.token }}', CI: 'true'}
        run: python3 tests/specops_readback.py
