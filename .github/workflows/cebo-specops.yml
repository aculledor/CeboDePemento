        import os

        from pathlib import Path

        import re

        import time

        import urllib.error

        import urllib.parse

        import urllib.request

        # From specops_delivery/diagnostics.py

        SAFE_CODES=frozenset('api-list api-pagination-limit api-path api-size api-url artifact-checksum artifact-host artifact-redirects artifact-size artifact-size-or-checksum baseline-bootstrap baseline-image build-artifact-ambiguous build-artifact-members build-size candidate-archive-size candidate-artifact candidate-contract candidate-evidence-absent candidate-fields candidate-hashes candidate-numbers candidate-obsolete candidate-target ci-after-merge ci-job-provenance ci-jobs-absent ci-pr-association ci-pr-not-merged ci-pr-number ci-timestamp command-failed credential-file-permission dev-receipt-format github-token-missing github-unavailable hosted-fixture-only main-source-not-integrated migration-not-supported-v1 oci-platform oci-provenance output-format previous-candidate-tree previous-promotion-still-pending producer-mode promotion-admin-gate promotion-candidate promotion-dev-receipt promotion-document promotion-files promotion-format promotion-revoked proposal-branch-unavailable published-digest-changed publisher-run registry-loopback registry-rewrote-digest required-ci source-actor source-candidate-mismatch source-ci source-ci-absent source-obsolete source-outside-scope source-pr source-pr-association source-pr-not-merged source-pr-number source-pr-state source-provenance source-run source-run-id source-tree tested-image-identity tested-oci-changed trusted-integration-retry trusted-main trusted-main-first-attempt verified-input-changed workflow-repository invalid-json evidence-shape command-timeout local-io invalid-evidence internal-error'.split())

        HTTP_CODES=frozenset('github-response-'+str(n) for n in (301,302,303,307,308,400,401,403,404,408,409,410,412,422,429,500,502,503,504))

        STAGES=frozenset('entrypoint event-validation api-read provenance candidate-discovery artifact-metadata artifact-download artifact-checksum artifact-extract oci-inspect oci-index oci-config runtime-test registry-start registry-port registry-copy registry-inspect runtime-pull runtime-start runtime-health runtime-identity candidate-bind promotion-prepare source-integration local-command'.split())

        _STACK=[]

        def reason(error):
            if isinstance(error,Failure):return error.code if type(error.code) is str and error.code in SAFE_CODES|HTTP_CODES else 'internal-error'
            if isinstance(error,json.JSONDecodeError):return 'invalid-json'
            if isinstance(error,subprocess.TimeoutExpired):return 'command-timeout'
            if isinstance(error,(KeyError,TypeError,IndexError)):return 'evidence-shape'
            if isinstance(error,OSError):return 'local-io'
            if type(error) is ValueError:
                value=error.args[0] if len(error.args)==1 and type(error.args[0]) is str else None
                return value if value in SAFE_CODES|HTTP_CODES else 'invalid-evidence'
            return 'internal-error'

        class Failure(ValueError):
            def __init__(self,context,code):
                super().__init__(code);self.context=context;self.code=code

        @contextmanager
        def stage(name):
            if name not in STAGES:raise Failure(('entrypoint',),'internal-error')
            _STACK.append(name)
            try:yield
            except Failure:raise
            except Exception as error:raise Failure(tuple(_STACK),reason(error)) from None
            finally:_STACK.pop()

        def diagnostic(name):
            def decorate(function):
                @wraps(function)
                def wrapped(*args,**kwargs):
                    with stage(name):return function(*args,**kwargs)
                return wrapped
            return decorate

        def diagnostic_record(error):
            context=error.context if isinstance(error,Failure) else ('entrypoint',)
            if not isinstance(context,tuple) or not context or any(type(s) is not str or s not in STAGES for s in context):context=('entrypoint',)
            return {'protocol':'specops-producer-v1','result':'rejected','stage':context[-1],'context':list(context),'code':reason(error)}

        # From specops_delivery/ci.py

        def ci_time(value):
            try:
                if not isinstance(value, str):
                    raise ValueError()
                result = datetime.fromisoformat(value.replace('Z', '+00:00'))
                if result.utcoffset() is None:
                    raise ValueError()
                return result
            except (TypeError, ValueError):
                raise ValueError('ci-timestamp') from None

        def ci_association(run, pr, expected_pr, allow_merged=False):
            if type(expected_pr) is not int or type(pr['number']) is not int or pr['number'] != expected_pr:
                raise ValueError('ci-pr-number')
            refs = run['pull_requests']
            if not isinstance(refs, list) or any(type(p.get('number')) is not int for p in refs):
                raise ValueError('ci-pr-association')
            numbers = [p['number'] for p in refs]
            # An explicit contradictory association is never an empty-list fallback.
            if numbers != [expected_pr] and numbers != []:
                raise ValueError('ci-pr-association')
            if pr['state'] == 'open' and not pr.get('merged_at'):
                if numbers != [expected_pr]:
                    raise ValueError('ci-pr-association')
                return False
            if not allow_merged or pr['state'] != 'closed' or pr.get('merged') is not True:
                raise ValueError('ci-pr-not-merged')
            ci_time(pr.get('merged_at'))
            return True

        def ci_before_merge(run, pr, jobs):
            merged = ci_time(pr.get('merged_at'))
            created, started = ci_time(run.get('created_at')), ci_time(run.get('run_started_at'))
            attempt = run.get('run_attempt')
            if type(attempt) is not int or attempt < 1 or not created <= started <= merged:
                raise ValueError('ci-after-merge')
            if not jobs or not any(j.get('conclusion') == 'success' for j in jobs):
                raise ValueError('ci-jobs-absent')
            for job in jobs:
                if (job.get('run_id') != run['id'] or job.get('run_attempt') != attempt or
                        job.get('status') != 'completed' or job.get('conclusion') not in ('success', 'skipped')):
                    raise ValueError('ci-job-provenance')
                first, last = ci_time(job.get('started_at')), ci_time(job.get('completed_at'))
                if not started <= first <= last <= merged:
                    raise ValueError('ci-after-merge')

        # From specops_delivery/producer.py

        CONFIG = {'app': 'cebo', 'repository': 'aculledor/CeboDePemento', 'image': 'ghcr.io/aculledor/cebo-de-pemento-dev', 'source_path': '.github/workflows/ci-ghcr.yml', 'publisher_path': '.github/workflows/cebo-specops.yml', 'build_artifact': 'specops-cebo-build-v1', 'schema': 0, 'frozen_paths': ['apps/api/migrations/'], 'port': 3001, 'health': '/api/health', 'required_workflows': ['.github/workflows/ci-ghcr.yml'], 'candidate_paths': ['Dockerfile', '.dockerignore', 'package.json', 'package-lock.json', 'tsconfig.base.json', 'apps/', 'packages/', 'catalogo.sqlite', '.github/workflows/ci-ghcr.yml', '.github/workflows/cebo-specops.yml']}

        SHA=re.compile(r'[a-f0-9]{40}\Z')

        DIGEST=re.compile(r'sha256:[a-f0-9]{64}\Z')

        OWNER=45120213

        def require(value, code):
            if not value: raise ValueError(code)

        def canonical(value):
            return json.dumps(value,sort_keys=True,separators=(',',':'),ensure_ascii=True).encode()

        def candidate(value,cfg):
            fields={'version','app','repository','pr','sha','tree','image','digest','platform','source_run','publisher_run','publisher_attempt','tested_digest','migration','schema'}
            require(isinstance(value,dict) and set(value)==fields,'candidate-fields')
            require(value['version']==1 and value['app']==cfg['app'] and value['repository']==cfg['repository'] and value['image']==cfg['image'],'candidate-target')
            for key in ('pr','source_run','publisher_run','publisher_attempt','schema','version'):
                require(type(value[key]) is int and value[key]>=(0 if key=='schema' else 1),'candidate-numbers')
            require(SHA.fullmatch(value['sha']) and SHA.fullmatch(value['tree']) and DIGEST.fullmatch(value['digest']),'candidate-hashes')
            require(value['digest']==value['tested_digest'] and value['platform']=='linux/amd64' and value['migration']=='none' and value['publisher_attempt']==1 and value['schema']==cfg['schema'],'candidate-contract')
            return value

        class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,*args):return None

        class API:
            def __init__(self,token):
                require(bool(token),'github-token-missing');self.token=token
                self.opener=urllib.request.build_opener(NoRedirect(),urllib.request.ProxyHandler({}))
            def open(self,url,method='GET',body=None,artifact=False):
                for attempt in range(4):
                    u=urllib.parse.urlsplit(url)
                    require(u.scheme=='https' and not u.username and u.port in (None,443),'api-url')
                    headers={'Accept':'application/vnd.github+json','User-Agent':'specops-producer-v1','X-GitHub-Api-Version':'2022-11-28'}
                    if u.hostname=='api.github.com': headers['Authorization']='Bearer '+self.token
                    else:require(artifact and method=='GET' and any(u.hostname.endswith(s) for s in ('.blob.core.windows.net','.actions.githubusercontent.com','.githubusercontent.com')),'artifact-host')
                    data=None if body is None else canonical(body)
                    if data is not None:headers['Content-Type']='application/json'
                    try:return self.opener.open(urllib.request.Request(url,data=data,headers=headers,method=method),timeout=60)
                    except urllib.error.HTTPError as error:
                        if artifact and error.code in (301,302,303,307,308):url=error.headers.get('Location','');continue
                        if error.code in (429,500,502,503,504) and attempt<3:
                            time.sleep(2**attempt);continue
                        raise ValueError('github-response-'+str(error.code)) from None
                    except (OSError,urllib.error.URLError):
                        if attempt==3:raise ValueError('github-unavailable') from None
                        time.sleep(2**attempt)
                raise ValueError('artifact-redirects')
            @diagnostic('api-read')
            def request(self,path,method='GET',body=None):
                require(path.startswith('/repos/') or path=='/graphql','api-path')
                require(all(p not in ('.','..') for p in urllib.parse.unquote(urllib.parse.urlsplit(path).path).split('/')),'api-path')
                with self.open('https://api.github.com'+path,method,body) as response:
                    data=response.read(8*1024*1024+1);require(len(data)<=8*1024*1024,'api-size')
                    return json.loads(data) if data else None
            def pages(self,path,key=None,minimum_id=0):
                result=[]
                for page in range(1,21):
                    value=self.request(path+('&' if '?' in path else '?')+f'per_page=100&page={page}')
                    rows=value[key] if key else value;require(isinstance(rows,list),'api-list')
                    result += [row for row in rows if not minimum_id or row['id']>=minimum_id]
                    if minimum_id and any(row['id']<minimum_id for row in rows):return result
                    if len(rows)<100:return result
                raise ValueError('api-pagination-limit')
            @diagnostic('artifact-download')
            def archive(self,repo,artifact,destination):
                require(DIGEST.fullmatch(artifact['digest']) and artifact['size_in_bytes']<=768*1024**2,'artifact-size-or-checksum')
                path=Path(destination)
                with self.open(f'https://api.github.com/repos/{repo}/actions/artifacts/{int(artifact["id"])}/zip',artifact=True) as response,path.open('xb') as output:
                    digest=hashlib.sha256();size=0
                    while chunk:=response.read(1024*1024):
                        size+=len(chunk);require(size<=768*1024**2,'artifact-size');digest.update(chunk);output.write(chunk)
                with stage('artifact-checksum'):
                    require('sha256:'+digest.hexdigest()==artifact['digest'],'artifact-checksum')
                return path

        def source_identity(pr,cfg,number,sha,open_only):
            require(pr['number']==number and type(pr['number']) is int,'source-pr-number')
            require(pr['head']['repo'] is not None and pr['head']['repo']['full_name']==cfg['repository'] and pr['base']['repo']['full_name']==cfg['repository'] and pr['base']['ref']=='main' and pr['user']['id']==OWNER,'source-pr')
            require(pr['head']['sha']==sha,'source-obsolete')
            if pr['state']=='open':
                require(not pr.get('merged_at'),'source-pr-state')
            else:
                require(not open_only and pr['state']=='closed' and pr.get('merged') is True,'source-pr-not-merged')
                ci_time(pr.get('merged_at'))

        def check_ci(api,cfg,run,pr,number,workflow_id,path,open_only):
            require(run['repository']['full_name']==cfg['repository'] and run['head_repository']['full_name']==cfg['repository'] and run['event']=='pull_request' and run['workflow_id']==workflow_id and run['path']==path and run['head_sha']==pr['head']['sha'],'source-provenance')
            require(run['actor']['id']==OWNER and run['triggering_actor']['id']==OWNER,'source-actor')
            require(run['status']=='completed' and run['conclusion']=='success' and SHA.fullmatch(run['head_sha']),'source-ci')
            source_identity(pr,cfg,number,run['head_sha'],open_only)
            if ci_association(run,pr,number,allow_merged=not open_only):
                jobs=api.pages('/repos/'+cfg['repository']+f'/actions/runs/{run["id"]}/attempts/{run["run_attempt"]}/jobs','jobs')
                ci_before_merge(run,pr,jobs)

        @diagnostic('provenance')
        def provenance(api,cfg,run_id,open_only=True,pr_number=None):
            repo='/repos/'+cfg['repository'];run=api.request(repo+f'/actions/runs/{int(run_id)}')
            require(run['id']==int(run_id),'source-run-id')
            if pr_number is None:
                require(open_only and len(run['pull_requests'])==1,'source-pr-association')
                pr_number=run['pull_requests'][0]['number']
            require(type(pr_number) is int and pr_number>0,'source-pr-number')
            pr=api.request(repo+f'/pulls/{pr_number}')
            workflow=api.request(repo+'/actions/workflows/'+cfg['source_path'].rsplit('/',1)[-1])
            check_ci(api,cfg,run,pr,pr_number,workflow['id'],cfg['source_path'],open_only)
            files=api.pages(repo+f'/pulls/{pr["number"]}/files')
            require(not any(path==scope or scope.endswith('/') and path.startswith(scope) for f in files for path in (f.get('filename',''),f.get('previous_filename','')) for scope in cfg.get('frozen_paths',[])),'migration-not-supported-v1')
            require(any(path==scope or scope.endswith('/') and path.startswith(scope) for f in files for path in (f.get('filename',''),f.get('previous_filename','')) for scope in cfg['candidate_paths']),'source-outside-scope')
            runs=api.pages(repo+f'/actions/workflows/{run["workflow_id"]}/runs?head_sha={run["head_sha"]}&event=pull_request','workflow_runs')
            require(runs and max(r['id'] for r in runs)==run['id'],'source-obsolete')
            tree=api.request(repo+'/git/commits/'+run['head_sha'])['tree']['sha'];require(SHA.fullmatch(tree),'source-tree')
            return {'sha':run['head_sha'],'tree':tree,'pr':pr['number'],'source_run':run['id']}

        @diagnostic('candidate-bind')
        def make_candidate(cfg,meta,publisher_run,attempt):
            return candidate({'version':1,'app':cfg['app'],'repository':cfg['repository'],'pr':meta['pr'],'sha':meta['sha'],'tree':meta['tree'],'image':cfg['image'],'digest':meta['digest'],'platform':'linux/amd64','source_run':meta['source_run'],'publisher_run':int(publisher_run),'publisher_attempt':int(attempt),'tested_digest':meta['digest'],'migration':'none','schema':cfg['schema']},cfg)

        def output(values):
            with open(os.environ['GITHUB_OUTPUT'],'a') as file:
                for key,value in values.items():
                    require(re.fullmatch(r'[a-z_]+',key) and '\n' not in str(value) and '\r' not in str(value),'output-format');file.write(key+'='+str(value)+'\n')

        @diagnostic('event-validation')
        def main():
            cfg = CONFIG
            mode = os.environ['SPECOPS_MODE']
            require(mode == 'candidate', 'producer-mode')
            api = API(os.environ['GH_TOKEN'])
            require(os.environ['GITHUB_REPOSITORY'] == cfg['repository'], 'workflow-repository')
            event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
            require(os.environ['GITHUB_REF'] == 'refs/heads/main' and os.environ['GITHUB_RUN_ATTEMPT'] == '1', 'trusted-main-first-attempt')
            source = int(event.get('workflow_run', {}).get('id') or event.get('inputs', {}).get('source_run', 0))
            require(source > 0, 'source-run')
            work = Path(os.environ['RUNNER_TEMP']) / ('specops-' + mode)
            work.mkdir(mode=448)
            meta = json.loads((Path(os.environ['RUNNER_TEMP']) / 'specops-fetch/meta.json').read_text())
            require(provenance(api, cfg, source) == {k: meta[k] for k in ('sha', 'tree', 'pr', 'source_run')}, 'candidate-obsolete')
            require(os.environ['REMOTE_DIGEST'] == meta['digest'] == os.environ['VERIFIED_DIGEST'], 'published-digest-changed')
            value = make_candidate(cfg, meta, os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT'])
            (work / 'candidate.json').write_bytes(canonical(value))
            output({'candidate_path': str(work / 'candidate.json')})

        if __name__ == '__main__':
            try:
                main()
            except Exception as error:
                print(json.dumps(diagnostic_record(error), sort_keys=True))
                raise SystemExit(1)

        SPECOPS_INLINE
      id: candidate
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: specops-candidate-v1
        path: ${{ steps.candidate.outputs.candidate_path }}
        retention-days: 90
        if-no-files-found: error
    - name: Remove only ephemeral registry credential
      if: always()
      run: rm -f -- "$RUNNER_TEMP/specops-auth.json"
