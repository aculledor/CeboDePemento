services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      APP_ORIGINS: https://${DOMAIN:?Configura DOMAIN en .env}
      DATABASE_PATH: ${DATABASE_PATH:-data/catalogo.sqlite}
      PHOTO_DIRECTORY: ${PHOTO_DIRECTORY:-data/photos}
      BACKUP_INTERVAL_HOURS: 24
      TRUST_PROXY: 172.16.0.0/12
    volumes:
      - fishing_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Configura DOMAIN en .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  fishing_data:
  caddy_data:
  caddy_config:
