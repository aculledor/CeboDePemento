# Reference drop-in for servidor-specops@cebo-dev.service; manual bootstrap only.
[Unit]
Requires=cebo-pemento-dev-preflight.service
After=cebo-pemento-dev-preflight.service

[Service]
# Runs every existing reconciliation tick, including after boot. No extra timer.
# Uses the central unit's writable private state directory; public certs only.
ExecStartPre=/usr/bin/python3 -I /usr/local/libexec/cebo-pemento-dev/validate-dev.py --tls-only --directory /opt/servicios-dev/cebo-pemento --tls-status /var/lib/servidor-specops/cebo-dev-tls.json
