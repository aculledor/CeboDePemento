# Standalone development stack. Never combine with the production Compose.
name: cebo-pemento-dev
services:
  app:
    image: ${CEBO_DEV_IMAGE:-cebo-pemento:dev}
    platform: linux/amd64
    user: "1000:1000"
    init: true
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      TZ: Europe/Madrid
      NODE_OPTIONS: --max-old-space-size=384
      APP_ORIGINS: https://127.0.0.1:18444
      DATABASE_PATH: data/catalogo.sqlite
      PHOTO_DIRECTORY: data/photos
      BACKUP_INTERVAL_HOURS: 0
      TRUST_PROXY: loopback,linklocal,uniquelocal
    volumes:
      - fishing_data:/app/data
    networks: [dev]
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,uid=1000,gid=1000,size=64m
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: caddy:2.11.2-alpine@sha256:834468128c7696cec0ceea6172f7d692daf645ae51983ca76e39da54a97c570d
    platform: linux/amd64
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:18444:8443"
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - caddy_data:/data
      - caddy_config:/config
    networks: [dev]
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -Y, "off", -q, --spider, "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
networks:
  dev:
    internal: true
volumes:
  fishing_data: {}
  caddy_data: {}
  caddy_config: {}
