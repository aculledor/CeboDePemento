# Standalone development stack. Never combine with the production Compose.
name: cebo-pemento-dev
services:
  app-dev:
    image: ${CEBO_DEV_IMAGE:?Configura la referencia DEV inmutable}
    platform: linux/amd64
    user: "1000:1000"
    init: true
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    labels: {com.servidor-casa.env: dev}
    sysctls: {net.ipv6.conf.all.disable_ipv6: "1"}
    dns: [127.0.0.1]
    oom_score_adj: 500
    cgroup_parent: servidor-dev.slice
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      TZ: Europe/Madrid
      NODE_OPTIONS: --max-old-space-size=384
      APP_ORIGINS: https://${CEBO_DEV_HOST:?Configura CEBO_DEV_HOST}:18444
      DATABASE_PATH: data/catalogo.sqlite
      PHOTO_DIRECTORY: data/photos
      BACKUP_INTERVAL_HOURS: 0
      TRUST_PROXY: loopback,linklocal,uniquelocal
    volumes:
      - fishing_data:/app/data
    networks: [dev]
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,uid=1000,gid=1000,size=64m
    logging: {driver: json-file, options: {max-size: 5m, max-file: "2"}}
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
  gateway-dev:
    image: caddy:2.11.2-alpine@sha256:834468128c7696cec0ceea6172f7d692daf645ae51983ca76e39da54a97c570d
    platform: linux/amd64
    user: "1000:1000"
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    labels: {com.servidor-casa.env: dev}
    sysctls: {net.ipv6.conf.all.disable_ipv6: "1"}
    dns: [127.0.0.1]
    oom_score_adj: 500
    cgroup_parent: servidor-dev.slice
    environment:
      DEV_HOST: ${CEBO_DEV_HOST:?Configura CEBO_DEV_HOST}
    ports:
      - "${CEBO_DEV_BIND:?Configura CEBO_DEV_BIND}:18444:8443"
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./tls
        target: /tls
        read_only: true
        bind: {create_host_path: false}
    networks: [dev, ingress]
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,uid=1000,gid=1000,size=16m
      - /data:rw,nosuid,nodev,noexec,uid=1000,gid=1000,size=8m
      - /config:rw,nosuid,nodev,noexec,uid=1000,gid=1000,size=8m
    logging: {driver: json-file, options: {max-size: 5m, max-file: "2"}}
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    pids_limit: 64
    depends_on:
      app-dev:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -Y, "off", -q, --spider, "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
networks:
  dev:
    name: cebo-pemento-dev_internal
    internal: true
    labels: {com.servidor-casa.env: dev}
    ipam: {config: [{subnet: 172.29.92.0/24}]}
  ingress:
    name: cebo-pemento-dev_ingress
    driver: bridge
    labels: {com.servidor-casa.env: dev}
    ipam: {config: [{subnet: 172.29.93.0/24}]}
volumes:
  fishing_data:
    name: cebo-pemento-dev_fishing_data
    labels: {com.servidor-casa.env: dev}
